<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />

    <title>Convyx — file tools that never leave your device</title>
    <meta
      name="description"
      content="Merge, split, convert and compress PDFs and images. Most tools run entirely in your browser, so your files never leave your device."
    />

    <!--
      Link previews are read by scrapers that do not run JavaScript, so these
      describe the site rather than the page. A per-page preview needs the HTML
      to exist before the browser does; that is prerendering, and it is not
      built yet. Until then, every shared link previews as Convyx itself, which
      is true of any of them.

      The image is the mark, so the card is the square `summary` rather than the
      wide one. A wide card wants artwork made for it, and an invented one
      stretched to fit reads worse than no card at all.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Convyx" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Convyx — file tools that never leave your device" />
    <meta
      property="og:description"
      content="Merge, split, convert and compress PDFs and images. Most tools run entirely in your browser, so your files never leave your device."
    />
    <meta property="og:image" content="%SITE_URL%/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Convyx mark" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Applied before paint so the page never flashes the wrong theme.
      (() => {
        const stored = localStorage.getItem('convyx-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (stored === 'light' || (stored !== 'dark' && prefersLight)) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
