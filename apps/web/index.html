<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Convyx — file tools that never leave your device</title>
    <meta
      name="description"
      content="Merge, split, convert and compress PDFs and images. Most tools run entirely in your browser, so your files never leave your device."
    />
    <script>
      // Applied before paint so the page never flashes the wrong theme.
      (() => {
        const stored = localStorage.getItem('convyx-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (stored === 'light' || (stored !== 'dark' && prefersLight)) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <!--
      THESIS: A tool site you already know how to use. The catalogue is the interface: search it,
      scan it by coloured category icon, click the one you need. Refuses the metaphor-led concept
      page — twice rejected here — and refuses the undifferentiated template by finishing it properly.
      OWN-WORLD: Near-black #08090B ground with #0E1013 panels and 1px #1E2027 hairlines. Inter
      throughout, tight optical sizing. One indigo #6E79F0 for actions and focus; each category owns a
      hue (PDF rose, Image teal) carried only by its icon tile and its active tab, so the grid is
      scannable by colour. Rounded 10-12px, soft single-source shadows, no gradient text, no glass.
      STORY: A visitor sees the tool they came for within one screen, learns their file is not
      uploaded, and starts the job.
      FIRST VIEWPORT: Plain headline, one sentence, a live tool search that filters the real registry,
      four quick-start tools, and the working Merge PDF dropzone beside it.
      FORM: Category convention at full craft. Chosen by the user over the roll, with iLovePDF and
      Smallpdf setting structure and Linear and Vercel setting finish. Seed key 27e0f7d8, canon exit.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
      verdict, and DESIGN.md
    -->
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
